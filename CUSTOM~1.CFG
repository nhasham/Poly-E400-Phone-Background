<!-- custom-background.cfg
     Custom config file for Poly Edge E400 background image.
     Parameter names/values below confirmed against this phone's own
     config export (EdgeE400_48256765DB1C, UC Software 8.4.1.0068)
     and its own web UI (Preferences > Background):
       bg.background.enabled="1"
       bg.color.selection="1,1"
       bg.color.bm.1.name     = primary (3.5") display background URL
       bg.color.bm.1.em.name  = secondary/"Expansion Module" display background URL

     Host this file on an HTTP server reachable by the phone (or import it
     directly via the phone's own web UI to test), then in Genesys Cloud
     Admin (Digital and Telephony > Telephony > Phone Management > Base
     Settings or Phones > Network > Provisioning > Custom Configuration
     Files) point to the URL of this file so it persists across reboots. -->

<PHONE_CONFIG>
  <bg
    bg.background.enabled="1"
    bg.color.selection="1,1"
    bg.color.bm.1.name="https://raw.githubusercontent.com/nhasham/Poly-E400-Phone-Background/main/SUNWAR~1.PNG"
    bg.color.bm.1.em.name="https://raw.githubusercontent.com/nhasham/Poly-E400-Phone-Background/main/SUNWAR~3.PNG"
  />
</PHONE_CONFIG>
